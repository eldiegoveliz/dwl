[main]
font=GeistMono Nerd Font:size=12
terminal=dwl-terminal -e
prompt="› "
lines=9
width=38
horizontal-pad=18
vertical-pad=14
inner-pad=8
icons-enabled=no
layer=overlay

[colors]
background=${background}${surface_alpha}
text=${foreground}ff
prompt=${accent}ff
input=${foreground}ff
match=${accent}ff
selection=${selection}f2
selection-text=${foreground}ff
selection-match=${accent}ff
border=${accent}88

[border]
width=1
radius=8
