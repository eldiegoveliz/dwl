[main]
font=GeistMono Nerd Font:size=12
pad=14x12
resize-by-cells=no
initial-window-size-chars=100x30
title=Terminal

[scrollback]
lines=10000

[cursor]
style=beam
blink=no

[bell]
urgent=no
notify=no

[colors-dark]
alpha=${terminal_alpha}
background=${background}
foreground=${foreground}
cursor=${background} ${accent}
selection-background=${selection}
selection-foreground=${foreground}
regular0=${background}
regular1=${red}
regular2=${green}
regular3=${yellow}
regular4=${blue}
regular5=${purple}
regular6=${accent}
regular7=${white}
bright0=${muted}
bright1=${red}
bright2=${green}
bright3=${yellow}
bright4=${blue}
bright5=${purple}
bright6=${accent}
bright7=${foreground}
